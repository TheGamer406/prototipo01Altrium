# Archivo:    frontend/nginx/default.conf
# Qué hace:   Sirve el build de Angular y hace proxy al API y al hub de SignalR.
# Recibe:     Peticiones del navegador en :80 (publicado como 5471).
# Procesa:    basic auth con /etc/nginx/.htpasswd; /api/ → api:8080; /hubs/ → api:8080 con WebSocket;
#             el resto cae en index.html (rutas de Angular).
# Devuelve:   HTML/JS/CSS estáticos o la respuesta del API.
# Se conecta: ← frontend/Dockerfile · → acompana-api · ← entrypoint.sh (genera .htpasswd)
# Estado:     Completo
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    auth_basic "Acompana";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        resolver 127.0.0.11 valid=5s;   # DNS de Docker: si la API se reinicia y cambia de IP, no hace falta reiniciar nginx
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /hubs/ {
        resolver 127.0.0.11 valid=5s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
