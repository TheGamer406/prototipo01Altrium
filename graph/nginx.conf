# Archivo:    graph/nginx.conf
# Qué hace:   Sirve el grafo del proyecto (HTML estático) con basic auth.
# Recibe:     Peticiones en :80 (publicado como 5472, perfil extras).
# Procesa:    auth_basic igual que la web; sirve site/index.html.
# Devuelve:   El grafo interactivo (frontend, backend y BD).
# Se conecta: ← graph/Dockerfile · ← graph/site/index.html
# Estado:     Completo
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    auth_basic "Acompana";
    auth_basic_user_file /etc/nginx/.htpasswd;
    location / { try_files $uri /index.html; }
}
